name: Ata Takvimi - iOS Build Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://atatakvimi.karneyn.com

      - name: Sync Capacitor iOS
        run: npx @capacitor/cli sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Xcode Archive (.xcarchive)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $PWD/build/AtaTakvimi.xcarchive \
                     clean archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Create IPA Package
        run: |
          mkdir -p build/Payload
          cp -r build/AtaTakvimi.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r AtaTakvimi.ipa Payload

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtaTakvimi-iOS-Archive
          path: build/AtaTakvimi.ipa

      - name: Upload to App Store Connect / TestFlight
        uses: apple-actions/upload-testflight-build@v1
        if: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' }}
        with:
          app-path: build/AtaTakvimi.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
